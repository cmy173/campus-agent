components:
  schemas:
    AcceptActionRequest:
      properties:
        operation:
          type: string
          enum:
          - apply
          - revoke
          title: Operation
      additionalProperties: false
      type: object
      required:
      - operation
      title: AcceptActionRequest
    Body_upload_conversation_file_api_v1_agent_conversations__conversation_id__files_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_conversation_file_api_v1_agent_conversations__conversation_id__files_post
    BrowserField:
      properties:
        name:
          type: string
          title: Name
        value:
          type: string
          title: Value
      type: object
      required:
      - name
      - value
      title: BrowserField
    BrowserOpenRequest:
      properties:
        url:
          anyOf:
          - type: string
            maxLength: 8192
          - type: 'null'
          title: Url
      additionalProperties: false
      type: object
      title: BrowserOpenRequest
    BrowserOpenResult:
      properties:
        running:
          type: boolean
          title: Running
        headed:
          type: boolean
          title: Headed
      type: object
      required:
      - running
      - headed
      title: BrowserOpenResult
    BrowserPage:
      properties:
        index:
          type: integer
          title: Index
        url:
          type: string
          title: Url
        title:
          type: string
          title: Title
      type: object
      required:
      - index
      - url
      - title
      title: BrowserPage
    BrowserPreview:
      properties:
        page_url:
          type: string
          title: Page Url
        kind:
          anyOf:
          - type: string
            const: explicit
          - type: 'null'
          title: Kind
        action_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Url
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
