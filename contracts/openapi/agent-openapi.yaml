components:
  schemas:
    AcceptActionRequest:
      properties:
        operation:
          type: string
          enum:
          - apply
          - revoke
          title: Operation
      additionalProperties: false
      type: object
      required:
      - operation
      title: AcceptActionRequest
    Body_upload_conversation_file_api_v1_agent_conversations__conversation_id__files_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_conversation_file_api_v1_agent_conversations__conversation_id__files_post
    ControlAddressRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        url:
          type: string
          pattern: ^http://127\.0\.0\.1:\d{1,5}$
          title: Url
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - url
      title: ControlAddressRequest
    ConversationRequest:
      properties:
        provider_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Provider Id
        send_to_provider:
          type: boolean
          title: Send To Provider
          default: false
        course_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Course Id
      additionalProperties: false
      type: object
      required:
      - provider_id
      title: ConversationRequest
    Empty:
      properties: {}
      additionalProperties: false
      type: object
      title: Empty
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    McpServer:
      properties:
        serverName:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,32}$
          title: Servername
        enabled:
          type: boolean
          title: Enabled
          default: true
        transport:
          type: string
          enum:
          - stdio
          - streamable-http
          title: Transport
          default: stdio
        command:
          type: string
          maxLength: 2048
          title: Command
          default: ''
        args:
          items:
            type: string
          type: array
          maxItems: 128
          title: Args
        cwd:
          type: string
          maxLength: 2048
          title: Cwd
          default: ''
        env:
          additionalProperties:
            type: string
          type: object
          maxProperties: 64
          title: Env
        url:
          type: string
          maxLength: 2048
          title: Url
          default: ''
        headers:
          additionalProperties:
            type: string
          type: object
          maxProperties: 64
          title: Headers
        toolCallTimeoutMs:
          type: integer
          maximum: 1800000.0
          minimum: 1000.0
          title: Toolcalltimeoutms
          default: 60000
      additionalProperties: false
      type: object
      required:
      - serverName
      title: McpServer
    ModelErrorRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        code:
          type: string
          enum:
          - PROVIDER_AUTH_FAILED
          - PROVIDER_RATE_LIMITED
          - PROVIDER_TIMEOUT
          - PROVIDER_UNREACHABLE
          - PROVIDER_INVALID_RESPONSE
          - PROVIDER_HTTP_ERROR
          - PROVIDER_CHANGED
          - BUDGET_EXCEEDED
          - CONSENT_REQUIRED
          title: Code
        message:
          type: string
          maxLength: 512
          minLength: 1
          title: Message
        retryable:
          type: boolean
          title: Retryable
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - code
      - message
      - retryable
      title: ModelErrorRequest
    ModelLeaseRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
      additionalProperties: false
      type: object
      required:
      - conversation_id
      title: ModelLeaseRequest
    ModelRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        messages:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 200
          minItems: 1
          title: Messages
        tools:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
            maxItems: 256
          - type: 'null'
          title: Tools
        max_tokens:
          type: integer
          maximum: 65536.0
          minimum: 1.0
          title: Max Tokens
          default: 16384
        attribution_headers:
          additionalProperties:
            type: string
          type: object
          title: Attribution Headers
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - messages
      title: ModelRequest
    NativeToolLeaseRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        call_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Call Id
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - call_id
      - name
      title: NativeToolLeaseRequest
    PublishFileRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        call_id:
          type: string
          maxLength: 256
          minLength: 1
          title: Call Id
        path:
          type: string
          maxLength: 4096
          minLength: 1
          title: Path
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - call_id
      - path
      title: PublishFileRequest
    RuntimeSettings:
      properties:
        workspace:
          type: string
          maxLength: 2048
          title: Workspace
          default: ''
        skill_dirs:
          items:
            type: string
          type: array
          maxItems: 32
          title: Skill Dirs
        search:
          $ref: '#/components/schemas/SearchSettings'
        mcp_servers:
          items:
            $ref: '#/components/schemas/McpServer'
          type: array
          maxItems: 32
          title: Mcp Servers
      additionalProperties: false
      type: object
      title: RuntimeSettings
    SearchSettings:
      properties:
        base_url:
          type: string
          maxLength: 2048
          title: Base Url
          default: ''
        model:
          type: string
          maxLength: 128
          title: Model
          default: ''
        key_mode:
          type: string
          enum:
          - shared
          - separate
          title: Key Mode
          default: shared
        api_key:
          anyOf:
          - type: string
