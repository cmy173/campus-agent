openapi: 3.1.0
info:
  title: Campus Agent additive contract
  version: 0.2.0-local
paths:
  /api/v1/agent/conversations:
    get:
      tags:
      - campus-agent
      summary: List Conversations
      operationId: list_conversations_api_v1_agent_conversations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - campus-agent
      summary: Create Conversation
      operationId: create_conversation_api_v1_agent_conversations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/conversations/{conversation_id}:
    get:
      tags:
      - campus-agent
      summary: Read Conversation
      operationId: read_conversation_api_v1_agent_conversations__conversation_id__get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/conversations/{conversation_id}/turns:
    post:
      tags:
      - campus-agent
      summary: Send Turn
      operationId: send_turn_api_v1_agent_conversations__conversation_id__turns_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: idempotency-key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/conversations/{conversation_id}/actions:
    get:
      tags:
      - campus-agent
      summary: List Actions
      operationId: list_actions_api_v1_agent_conversations__conversation_id__actions_get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/conversations/{conversation_id}/actions/{action_id}/accept:
    post:
      tags:
      - campus-agent
      summary: Accept Action
      operationId: accept_action_api_v1_agent_conversations__conversation_id__actions__action_id__accept_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          title: Action Id
      - name: idempotency-key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptActionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/turns/{turn_id}:
    get:
      tags:
      - campus-agent
      summary: Read Turn
      operationId: read_turn_api_v1_agent_turns__turn_id__get
      parameters:
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
          title: Turn Id
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: After
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/turns/{turn_id}/cancel:
    post:
      tags:
      - campus-agent
      summary: Cancel Turn
      operationId: cancel_turn_api_v1_agent_turns__turn_id__cancel_post
      parameters:
      - name: turn_id
        in: path
        required: true
        schema:
          type: string
          title: Turn Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/internal/schemas:
    post:
      tags:
      - campus-agent
      summary: Internal Schemas
      operationId: internal_schemas_api_v1_agent_internal_schemas_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Empty'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/internal/tool:
    post:
      tags:
      - campus-agent
      summary: Internal Tool
      operationId: internal_tool_api_v1_agent_internal_tool_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agent/internal/model:
    post:
      tags:
      - campus-agent
      summary: Internal Model
      operationId: internal_model_api_v1_agent_internal_model_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AcceptActionRequest:
      properties:
        operation:
          type: string
          enum:
          - apply
          - revoke
          title: Operation
      additionalProperties: false
      type: object
      required:
      - operation
      title: AcceptActionRequest
    ConversationRequest:
      properties:
        provider_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Provider Id
        send_to_provider:
          type: boolean
          title: Send To Provider
          default: false
        course_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Course Id
      additionalProperties: false
      type: object
      required:
      - provider_id
      title: ConversationRequest
    Empty:
      properties: {}
      additionalProperties: false
      type: object
      title: Empty
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ModelRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        messages:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 200
          minItems: 1
          title: Messages
        tools:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 50
          title: Tools
        max_tokens:
          type: integer
          maximum: 4096.0
          minimum: 1.0
          title: Max Tokens
          default: 4096
        attribution_headers:
          additionalProperties:
            type: string
          type: object
          title: Attribution Headers
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - messages
      title: ModelRequest
    ToolRequest:
      properties:
        conversation_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversation Id
        call_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Call Id
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        arguments:
          additionalProperties: true
          type: object
          title: Arguments
      additionalProperties: false
      type: object
      required:
      - conversation_id
      - call_id
      - name
      - arguments
      title: ToolRequest
    TurnRequest:
      properties:
        text:
          type: string
          maxLength: 8000
          minLength: 1
          title: Text
        course_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Course Id
        clear_course_context:
          type: boolean
          title: Clear Course Context
          default: false
        action_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Action Id
      additionalProperties: false
      type: object
      required:
      - text
      title: TurnRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
