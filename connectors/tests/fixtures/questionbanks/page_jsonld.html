      },
      {
        "@type": "Question",
        "name": "什么是等差数列的通项公式？"
      }
    ]
  }
  </script>
  <script type="application/ld+json">

  </script>
</head>
<body>
  <main>
    <h1>数学概念速查（合成 fixture）</h1>

  </main>
</body>
</html>
