name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API and connector dependencies
        run: |
          python -m pip install -r apps/api/requirements.txt
          python -m pip install -r connectors/requirements.txt
      - name: API suite
        working-directory: apps/api
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          $env:STUDY_DATABASE_URL = 'sqlite:///' + (Join-Path $PWD '.ci\api.db')
          $env:STUDY_FILES_DIR = Join-Path $PWD '.ci\files'
          $env:STUDY_SECRETS_DIR = Join-Path $PWD '.ci\secrets'
          $env:CAMPUS_AGENT_HOME = Join-Path $PWD '.ci\home'
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          python -m pytest -q
      - name: Migrated connector regression (root tests)
        run: python -m pytest tests -q
      - name: Contract export matches the implemented Agent API
        run: python tools/export_agent_contract.py --check
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test -- --maxWorkers=2
        working-directory: apps/web
