name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-workbench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check campus_agent/static/app.js
      - run: node --check campus_agent/static/campus.js
      - run: node --check campus_agent/static/academics.js
      - run: node --check campus_agent/static/passport.js
      - run: node tests/frontend-auth.test.cjs
