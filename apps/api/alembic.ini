[alembic]
script_location = migrations
prepend_sys_path = .
# URL is not configured here; env.py reads it from app.config
# (STUDY_DATABASE_URL env var, default local SQLite).
# NOTE: keep this file ASCII-only -- alembic parses it with the locale
# encoding (GBK on zh-CN Windows), so non-ASCII comments crash configparser.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
